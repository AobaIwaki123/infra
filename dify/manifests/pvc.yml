apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dify-postgres
  namespace: dify
spec:
  storageClassName: cephfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
