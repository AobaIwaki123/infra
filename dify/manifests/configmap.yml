apiVersion: v1
kind: ConfigMap
metadata:
  name: dify-config
  namespace: dify
data:
  CONSOLE_API_URL: "https://dify.aooba.net/console/api"
  CONSOLE_WEB_URL: "https://dify.aooba.net"
  SERVICE_API_URL: "https://dify.aooba.net/api"
  APP_API_URL: "https://dify.aooba.net/api"
  APP_WEB_URL: "https://dify.aooba.net"
  FILES_URL: "https://dify.aooba.net"
  INTERNAL_FILES_URL: "http://dify-api:5001"
  LOG_LEVEL: "INFO"
  DEPLOY_ENV: "PRODUCTION"
  STORAGE_TYPE: "local"
  VECTOR_STORE: "weaviate"
  WEAVIATE_ENDPOINT: "http://dify-weaviate:8080"
  DB_HOST: "dify-postgres"
  DB_USERNAME: "postgres"
  DB_DATABASE: "dify"
  REDIS_HOST: "dify-redis"
  REDIS_DB: "0"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "dify"
