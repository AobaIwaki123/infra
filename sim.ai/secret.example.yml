apiVersion: v1
kind: Secret
metadata:
  name: sim-ai-secret
  namespace: sim-ai
type: Opaque
data:
  # Default PostgreSQL user, base64 encoded "postgres"
  POSTGRES_USER: cG9zdGdyZXM=
  # Default PostgreSQL password, base64 encoded "postgres"
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  # Default PostgreSQL database, base64 encoded "simstudio"
  POSTGRES_DB: c2ltc3R1ZGlv
  # Authentication secret. Generate with: openssl rand -hex 32 | tr -d '\n' | base64
  BETTER_AUTH_SECRET: eW91cl9hdXRoX3NlY3JldF9oZXJl
  # Encryption key. Generate with: openssl rand -hex 32 | tr -d '\n' | base64
  ENCRYPTION_KEY: eW91cl9lbmNyeXB0aW9uX2tleV9oZXJl
  # API Key for an external service (Copilot). Obtain this from the service provider and base64 encode it.
  COPILOT_API_KEY: eW91cl9jb3BpbG90X2FwaV9rZXlfaGVyZQ==
  # URL for the internal Sim Agent API service. Base64 encoded "http://localhost:3001"
  SIM_AGENT_API_URL: aHR0cDovL2xvY2FsaG9zdDozMDAx
